<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1b22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meine Startseite</title>
<style>
:root{
  --bg:#f9f9fb;--fg:#15141a;--muted:#5b5b66;--surface:#ffffff;--surface2:#f0f0f4;
  --line:#d7d7db;--accent:#9059ff;--accent2:#7542e5;--shadow:0 2px 8px rgba(0,0,0,.14);
  --search:#ffffffcc;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1b22;--fg:#fbfbfe;--muted:#b1b1ba;--surface:#2b2a33;--surface2:#42414d;
    --line:#52525e;--accent:#ab71ff;--accent2:#9059ff;--shadow:0 2px 10px rgba(0,0,0,.35);
    --search:#2b2a33e8;
  }
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background-size:cover;background-position:center;background-attachment:fixed;
}
body.has-bg::before{
  content:"";position:fixed;inset:0;background:rgba(15,15,20,.38);backdrop-filter:blur(2px);z-index:-1;
}
main{max-width:760px;margin:0 auto;padding:14px 10px 70px}
.top{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
}
.brand{display:flex;align-items:center;gap:11px}
.title{font-size:20px;font-weight:750;letter-spacing:-.2px}
.settings{
  width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--fg);
  font-size:22px
}
.settings:hover{background:color-mix(in srgb,var(--surface) 75%,transparent)}
.search-wrap{margin:0 auto 20px;max-width:640px}
.search{
  display:flex;align-items:center;background:var(--search);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(12px);
}
.search .g{
  padding-left:15px;font-weight:800;font-size:18px;color:#4285f4
}
.search input{
  flex:1;border:0;outline:none;background:transparent;color:var(--fg);font-size:16px;
  padding:15px 14px
}
.search button{
  border:0;background:transparent;color:var(--muted);font-size:20px;padding:10px 15px
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;margin:5px 4px 12px
}
.section-head h2{font-size:16px;margin:0;font-weight:750}
.section-head button{
  border:0;background:transparent;color:var(--muted);font-size:13px;padding:7px 8px;border-radius:8px
}
.grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px 6px;
}
@media(min-width:520px){.grid{grid-template-columns:repeat(6,1fr);gap:14px 9px}}
@media(min-width:720px){.grid{grid-template-columns:repeat(8,1fr);gap:16px 10px}}
.tile{
  min-width:0;text-align:center;position:relative;padding:3px 1px 7px;border-radius:14px;
  user-select:none
}
.tile.dragging{opacity:.35}
.tile.drag-over{outline:2px dashed var(--accent);outline-offset:2px}
.tile-link{display:block;text-decoration:none;color:inherit}
.icon{
  width:54px;height:54px;margin:auto;border-radius:16px;background:var(--surface);
  box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;position:relative
}
.icon img{width:33px;height:33px;object-fit:contain}
.folder-icon{
  font-size:31px;background:linear-gradient(145deg,var(--surface),var(--surface2))
}
.label{
  margin-top:6px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 2px
}
.more{
  position:absolute;top:-7px;right:-1px;width:30px;height:30px;border:0;border-radius:50%;
  background:var(--surface);color:var(--fg);box-shadow:0 1px 4px #0003;font-size:20px;
  line-height:27px;font-weight:700;display:none;padding:0;z-index:3
}
.tile:hover .more,.tile:focus-within .more{display:block}
@media (hover:none),(pointer:coarse){
  .more{display:block}
}
.add-tile .icon{border:1.5px dashed var(--line);box-shadow:none;font-size:28px;color:var(--muted);background:transparent}
.breadcrumbs{margin:0 4px 14px;color:var(--muted);font-size:13px}
.breadcrumbs button{border:0;background:transparent;color:var(--accent);padding:0;font-weight:700}
.panel{
  position:fixed;inset:0 0 0 auto;width:min(88vw,340px);background:var(--surface);z-index:20;
  box-shadow:-8px 0 30px #0005;padding:22px 18px;transform:translateX(105%);transition:.2s ease
}
.panel.open{transform:translateX(0)}
.panel h3{margin:0 0 18px;font-size:18px}
.panel button{
  width:100%;text-align:left;border:0;border-radius:11px;background:transparent;color:var(--fg);
  padding:13px 12px;margin:3px 0;font-size:15px
}
.panel button:hover{background:var(--surface2)}
.overlay{
  position:fixed;inset:0;background:#0006;z-index:19;display:none
}
.overlay.open{display:block}
dialog{
  border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);
  width:min(92vw,480px);padding:0;box-shadow:0 20px 60px #0007
}
dialog::backdrop{background:#0008}
.dialog{padding:20px}
.dialog h3{margin:0 0 14px}
.dialog label{display:block;color:var(--muted);font-size:12px;margin:11px 0 5px}
.dialog input{
  width:100%;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--fg);
  padding:12px 13px;font-size:15px
}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:10px;padding:10px 13px;font-weight:700
}
.btn.primary{background:var(--accent2);color:white;border-color:transparent}
.btn.danger{color:#c50042}
.tip{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;line-height:1.4}
#bgFile,#importFile{display:none}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">
      <div class="title">Meine Startseite</div>
    </div>
    <button class="settings" id="settingsBtn" aria-label="Einstellungen">⋮</button>
  </div>

  <form class="search-wrap" action="https://www.google.com/search" method="get">
    <div class="search">
      <span class="g">G</span>
      <input name="q" placeholder="Suchen oder Adresse eingeben" autocomplete="off">
      <button aria-label="Suchen">→</button>
    </div>
  </form>

  <div class="breadcrumbs" id="breadcrumbs"></div>

  <div class="section-head">
    <h2>Verknüpfungen</h2>
    <button id="editHint">Gedrückt halten / ziehen</button>
  </div>

  <section class="grid" id="grid"></section>

  <div class="tip">Beliebig viele Verknüpfungen · Ordner · Drag & Drop · lokales Backup</div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel">
  <h3>Startseite anpassen</h3>
  <button id="addLinkMenu">＋ Verknüpfung hinzufügen</button>
  <button id="addFolderMenu">📁 Ordner hinzufügen</button>
  <button id="bgBtn">🖼 Hintergrundbild wählen</button>
  <button id="clearBgBtn">✕ Hintergrund entfernen</button>
  <button id="exportBtn">⇩ Sicherung exportieren</button>
  <button id="importBtn">⇧ Sicherung importieren</button>
  <button id="installBtn" style="display:none">＋ App installieren</button>
</aside>

<dialog id="linkDlg">
<form method="dialog" class="dialog" id="linkForm">
  <h3 id="linkTitle">Verknüpfung</h3>
  <label>Name</label><input id="linkName" required placeholder="z. B. Wikipedia">
  <label>Adresse</label><input id="linkUrl" required inputmode="url" placeholder="https://…">
  <div class="row">
    <button class="btn" value="cancel">Abbrechen</button>
    <button class="btn danger" id="deleteLinkBtn" type="button">Löschen</button>
    <button class="btn primary" value="default">Speichern</button>
  </div>
</form>
</dialog>

<dialog id="folderDlg">
<form method="dialog" class="dialog" id="folderForm">
  <h3 id="folderTitle">Ordner</h3>
  <label>Name</label><input id="folderName" required placeholder="z. B. Nachrichten">
  <div class="row">
    <button class="btn" value="cancel">Abbrechen</button>
    <button class="btn danger" id="deleteFolderBtn" type="button">Löschen</button>
    <button class="btn primary" value="default">Speichern</button>
  </div>
</form>
</dialog>

<input id="bgFile" type="file" accept="image/*">
<input id="importFile" type="file" accept="application/json">

<script>
const KEY='neutral-android-home-v1', BGKEY='neutral-android-bg-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
  current:'root',
  folders:{root:{name:'Start',items:[
    {type:'link',name:'Wikipedia',url:'https://de.wikipedia.org/'},
    {type:'link',name:'YouTube',url:'https://www.youtube.com/'},
    {type:'link',name:'Google',url:'https://www.google.de/'},
    {type:'link',name:'Amazon',url:'https://www.amazon.de/'}
  ]}}
};
let editIndex=-1,dragIndex=null;
const $=id=>document.getElementById(id);
const grid=$('grid');

function cur(){return data.folders[data.current]}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function clean(u){u=u.trim();return /^https?:\/\//i.test(u)?u:'https://'+u}
function host(u){try{return new URL(u).hostname}catch{return ''}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function render(){
  const f=cur(); grid.innerHTML='';
  $('breadcrumbs').innerHTML=data.current==='root'?'':`<button onclick="goRoot()">← Startseite</button> &nbsp; ${esc(f.name)}`;
  f.items.forEach((x,i)=>{
    const t=document.createElement('div');t.className='tile';
    t.draggable=true;
    if(x.type==='folder'){
      t.innerHTML=`<button class="more">⋮</button><div class="tile-link"><div class="icon folder-icon">📁</div><div class="label">${esc(x.name)}</div></div>`;
      t.querySelector('.tile-link').onclick=()=>{data.current=x.id;save()};
    }else{
      const h=host(x.url),fav=h?`https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64`:'';
      t.innerHTML=`<button class="more">⋮</button><a class="tile-link" href="${esc(x.url)}"><div class="icon">${fav?`<img src="${fav}" onerror="this.remove()">`:esc((x.name||'?')[0])}</div><div class="label">${esc(x.name)}</div></a>`;
    }
    t.querySelector('.more').onclick=e=>{e.preventDefault();e.stopPropagation();x.type==='folder'?openFolder(i):openLink(i)};
    t.ondragstart=()=>{dragIndex=i;t.classList.add('dragging')};
    t.ondragend=()=>{dragIndex=null;t.classList.remove('dragging');document.querySelectorAll('.tile').forEach(el=>el.classList.remove('drag-over'))};
    t.ondragover=e=>{e.preventDefault();t.classList.add('drag-over')};
    t.ondragleave=()=>t.classList.remove('drag-over');
    t.ondrop=e=>{
      e.preventDefault();t.classList.remove('drag-over');
      if(dragIndex===null||dragIndex===i)return;
      const a=cur().items,[m]=a.splice(dragIndex,1);a.splice(i,0,m);save()
    };
    grid.appendChild(t)
  });
  const add=document.createElement('div');add.className='tile add-tile';
  add.innerHTML='<div class="tile-link"><div class="icon">＋</div><div class="label">Hinzufügen</div></div>';
  add.onclick=()=>openLink(-1);grid.appendChild(add)
}
function goRoot(){data.current='root';save()} window.goRoot=goRoot;

function openLink(i=-1){
  editIndex=i;$('linkTitle').textContent=i<0?'Verknüpfung hinzufügen':'Verknüpfung bearbeiten';
  $('linkName').value=i<0?'':cur().items[i].name;$('linkUrl').value=i<0?'':cur().items[i].url;
  $('deleteLinkBtn').style.display=i<0?'none':'inline-block';$('linkDlg').showModal()
}
$('linkForm').addEventListener('submit',e=>{
  if(e.submitter?.value==='cancel')return;e.preventDefault();
  const x={type:'link',name:$('linkName').value.trim(),url:clean($('linkUrl').value)};
  if(!x.name||!x.url)return;
  editIndex<0?cur().items.push(x):cur().items[editIndex]=x;save();$('linkDlg').close()
});
$('deleteLinkBtn').onclick=()=>{if(editIndex>=0&&confirm('Verknüpfung löschen?')){cur().items.splice(editIndex,1);save();$('linkDlg').close()}};

function openFolder(i=-1){
  editIndex=i;$('folderTitle').textContent=i<0?'Ordner hinzufügen':'Ordner bearbeiten';
  $('folderName').value=i<0?'':cur().items[i].name;
  $('deleteFolderBtn').style.display=i<0?'none':'inline-block';$('folderDlg').showModal()
}
$('folderForm').addEventListener('submit',e=>{
  if(e.submitter?.value==='cancel')return;e.preventDefault();
  const name=$('folderName').value.trim();if(!name)return;
  if(editIndex<0){const id='f_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);data.folders[id]={name,items:[]};cur().items.push({type:'folder',name,id})}
  else{const item=cur().items[editIndex];item.name=name;data.folders[item.id].name=name}
  save();$('folderDlg').close()
});
$('deleteFolderBtn').onclick=()=>{if(editIndex<0)return;const item=cur().items[editIndex];if(confirm('Ordner und alle Inhalte löschen?')){delete data.folders[item.id];cur().items.splice(editIndex,1);save();$('folderDlg').close()}};

function openPanel(v=true){$('panel').classList.toggle('open',v);$('overlay').classList.toggle('open',v)}
$('settingsBtn').onclick=()=>openPanel(true);$('overlay').onclick=()=>openPanel(false);
$('addLinkMenu').onclick=()=>{openPanel(false);openLink(-1)};$('addFolderMenu').onclick=()=>{openPanel(false);openFolder(-1)};

$('bgBtn').onclick=()=>{$('bgFile').click();openPanel(false)};
$('bgFile').onchange=()=>{const f=$('bgFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{localStorage.setItem(BGKEY,r.result);applyBg()};r.readAsDataURL(f);$('bgFile').value=''};
$('clearBgBtn').onclick=()=>{localStorage.removeItem(BGKEY);applyBg();openPanel(false)};
function applyBg(){const bg=localStorage.getItem(BGKEY);document.body.style.backgroundImage=bg?`url("${bg}")`:'';document.body.classList.toggle('has-bg',!!bg)}

$('exportBtn').onclick=()=>{const pack={data,bg:localStorage.getItem(BGKEY)||null};const b=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meine-startseite-backup.json';a.click();URL.revokeObjectURL(a.href);openPanel(false)};
$('importBtn').onclick=()=>{$('importFile').click();openPanel(false)};
$('importFile').onchange=async()=>{try{const p=JSON.parse(await $('importFile').files[0].text());if(p.data?.folders){data=p.data;localStorage.setItem(KEY,JSON.stringify(data))}if(p.bg)localStorage.setItem(BGKEY,p.bg);applyBg();render()}catch{alert('Ungültige Sicherungsdatei.')} $('importFile').value=''};

applyBg();render();

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  const b=document.getElementById('installBtn'); if(b) b.style.display='block';
});
document.getElementById('installBtn')?.addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBtn').style.display='none';
});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

</script>
</body>
</html>
