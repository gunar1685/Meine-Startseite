<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1b22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meine Startseite – Desktop Abschnitte</title>
<style>
:root{
  --bg:#f9f9fb;--fg:#15141a;--muted:#5b5b66;--surface:#ffffff;--surface2:#f0f0f4;
  --line:#d7d7db;--accent:#9059ff;--accent2:#7542e5;--shadow:0 2px 8px rgba(0,0,0,.14);
  --search:#ffffffcc;
}
html[data-theme="dark"]{
  --bg:#111218;--fg:#f7f7fa;--muted:#c7c7d1;--surface:#3b3d49;--surface2:#4b4e5d;
  --line:#676a7b;--accent:#c39aff;--accent2:#a875ff;--shadow:0 4px 16px rgba(0,0,0,.55);
  --search:#292b35f2;
}
html[data-theme="light"]{
  --bg:#f9f9fb;--fg:#15141a;--muted:#5b5b66;--surface:#ffffff;--surface2:#f0f0f4;
  --line:#d7d7db;--accent:#9059ff;--accent2:#7542e5;--shadow:0 2px 8px rgba(0,0,0,.14);
  --search:#ffffffcc;
}
@media(prefers-color-scheme:dark){
  html:not([data-theme]){
    --bg:#17171c;--fg:#f4f4f7;--muted:#b8b8c2;--surface:#25252d;--surface2:#34343e;
    --line:#484852;--accent:#b785ff;--accent2:#9b63f7;--shadow:0 3px 12px rgba(0,0,0,.42);
    --search:#25252dea;
  }
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background-size:cover;background-position:center;background-attachment:fixed;
  transition:background-color .2s ease,color .2s ease;
}
body.has-bg::before{
  content:"";position:fixed;inset:0;background:rgba(15,15,20,.38);backdrop-filter:blur(2px);z-index:-1;
}
main{width:min(96vw,1920px);max-width:none;margin:0 auto;padding:22px 24px 80px}
.top{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
}
.brand{display:flex;align-items:center;gap:11px}
.title{font-size:20px;font-weight:750;letter-spacing:-.2px}
.settings{
  width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--fg);
  font-size:22px
}
.settings:hover{background:color-mix(in srgb,var(--surface) 75%,transparent)}
.search-wrap{margin:0 auto 26px;max-width:760px}
.search{
  display:flex;align-items:center;background:var(--search);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(12px);
}
.search .g{
  padding-left:15px;font-weight:800;font-size:18px;color:#4285f4
}
.search input{
  flex:1;border:0;outline:none;background:transparent;color:var(--fg);font-size:16px;
  padding:15px 14px
}
.search button{
  border:0;background:transparent;color:var(--muted);font-size:20px;padding:10px 15px
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;margin:5px 4px 12px
}
.section-head h2{font-size:16px;margin:0;font-weight:750}
.section-head button{
  border:0;background:transparent;color:var(--muted);font-size:13px;padding:7px 8px;border-radius:8px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
  gap:20px 14px;
  align-items:start;
}
@media(max-width:899px){
  main{width:100%;padding:14px 10px 70px}
  .grid{grid-template-columns:repeat(5,1fr);gap:12px 6px}
}
@media(min-width:900px) and (max-width:1100px){
  .grid{grid-template-columns:repeat(8,1fr)}
}
@media(min-width:1600px){
  .grid{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:24px 18px}
}
.tile{
  min-width:0;text-align:center;position:relative;padding:3px 1px 7px;border-radius:14px;
  user-select:none
}
.tile.dragging{opacity:.35}
.tile.drag-over{outline:2px dashed var(--accent);outline-offset:2px}
.tile-link{display:block;text-decoration:none;color:inherit}
.icon{
  width:64px;height:64px;margin:auto;border-radius:18px;background:var(--surface);
  box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;position:relative
}
.icon img{width:38px;height:38px;object-fit:contain}
.folder-icon{
  font-size:36px;background:linear-gradient(145deg,var(--surface),var(--surface2))
}
.label{
  margin-top:8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 2px
}
.more{
  position:absolute;top:-4px;right:calc(50% - 43px);width:28px;height:28px;border:0;border-radius:50%;
  background:var(--surface);color:var(--fg);box-shadow:0 1px 5px rgba(0,0,0,.28);font-size:19px;
  line-height:25px;font-weight:700;display:none;padding:0;z-index:3;cursor:pointer;
  transition:background-color .2s ease,color .2s ease,transform .12s ease
}
.more:hover{background:var(--surface2);transform:scale(1.04)}
.tile:hover .more,.tile:focus-within .more{display:block}
@media (hover:none),(pointer:coarse){
  .more{display:block}
}
.add-tile .icon{border:1.5px dashed var(--line);box-shadow:none;font-size:28px;color:var(--muted);background:transparent}
.breadcrumbs{margin:0 4px 14px;color:var(--muted);font-size:13px}
.breadcrumbs button{border:0;background:transparent;color:var(--accent);padding:0;font-weight:700}
.panel{
  position:fixed;inset:0 0 0 auto;width:min(88vw,340px);background:var(--surface);z-index:20;
  box-shadow:-8px 0 30px #0005;padding:22px 18px;transform:translateX(105%);transition:.2s ease
}
.panel.open{transform:translateX(0)}
.panel h3{margin:0 0 18px;font-size:18px}
.panel button{
  width:100%;text-align:left;border:0;border-radius:11px;background:transparent;color:var(--fg);
  padding:13px 12px;margin:3px 0;font-size:15px
}
.panel button:hover{background:var(--surface2)}
.overlay{
  position:fixed;inset:0;background:#0006;z-index:19;display:none
}
.overlay.open{display:block}
dialog{
  border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);
  width:min(92vw,480px);padding:0;box-shadow:0 20px 60px #0007
}
dialog::backdrop{background:#0008}
.dialog{padding:20px}
.dialog h3{margin:0 0 14px}
.dialog label{display:block;color:var(--muted);font-size:12px;margin:11px 0 5px}
.dialog input{
  width:100%;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--fg);
  padding:12px 13px;font-size:15px
}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:10px;padding:10px 13px;font-weight:700
}
.btn.primary{background:var(--accent2);color:white;border-color:transparent}
.btn.danger{color:#c50042}
.tip{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;line-height:1.4}
#bgFile,#importFile{display:none}

.theme-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.theme-row .theme-state{color:var(--muted);font-size:13px;font-weight:650}
html[data-theme="dark"] .icon{
  background:#3b3d49;
  border:1px solid #747789;
  box-shadow:0 5px 18px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.05) inset
}
html[data-theme="dark"] .folder-icon{background:linear-gradient(145deg,#4a4d5b,#343641)}
html[data-theme="dark"] .add-tile .icon{background:#242630;border:1.5px dashed #777a8d;color:#dedee7}
html[data-theme="dark"] .label{color:#f7f7fa;text-shadow:0 1px 2px rgba(0,0,0,.55)}
html[data-theme="dark"] .more{background:#505362;border:1px solid #777a8b;color:#fff;box-shadow:0 2px 7px rgba(0,0,0,.6)}
html[data-theme="dark"] .more:hover{background:#626678}
html[data-theme="dark"] .panel,html[data-theme="dark"] dialog{
  box-shadow:0 5px 20px rgba(0,0,0,.55)
}
html[data-theme="dark"] body.has-bg::before{background:rgba(5,5,9,.58)}

.sections{display:flex;flex-direction:column;gap:28px}
.section-block{position:relative}
.section-block.drag-target{outline:2px dashed var(--accent);outline-offset:8px;border-radius:16px}
.section-title-row{display:flex;align-items:center;justify-content:space-between;margin:3px 4px 12px;gap:12px}
.section-title-row h2{font-size:16px;margin:0;font-weight:800;letter-spacing:.1px}
.section-actions{display:flex;align-items:center;gap:4px}
.section-action{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:6px 9px;font-size:16px;cursor:pointer}
.section-action:hover{background:var(--surface2);color:var(--fg)}
.section-add-note{color:var(--muted);font-size:12px;margin-left:4px;margin-top:-3px}
.grid.reorder-active .tile:not(.add-tile){cursor:grabbing}
.tile.longpress-ready{transform:scale(1.03);transition:transform .12s ease}
.tile,.tile .tile-link{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media (hover:none),(pointer:coarse){.tile:not(.add-tile){touch-action:pan-y}}
.tile.touch-dragging{opacity:.28}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) scale(1.05);width:88px;text-align:center}
.drag-ghost .more{display:none!important}
.drop-marker{outline:2px dashed var(--accent);outline-offset:3px}
.section-select-wrap{display:none}
.section-select-wrap.show{display:block}
.dialog select{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--fg);padding:12px 13px;font-size:15px}
.section-limit{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.4}
.empty-section{color:var(--muted);font-size:13px;padding:7px 4px 4px}


/* v8 – dezente Abschnittstrenner, automatisch passend zu Light/Dark */
.section-block + .section-block {
  margin-top: 30px;
  padding-top: 30px;
  border-top: 1px solid rgba(24, 24, 27, .14);
}
body.dark .section-block + .section-block {
  border-top-color: rgba(255, 255, 255, .20);
}


/* v11 – kompaktere Abstände an den Abschnittstrennern */
.section-block + .section-block {
  margin-top: 16px;
  padding-top: 16px;
}

</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">
      <div class="title">Meine Startseite - Verknüpfungen</div>
    </div>
    <button class="settings" id="settingsBtn" aria-label="Einstellungen">⋮</button>
  </div>

  <form class="search-wrap" action="https://www.google.com/search" method="get">
    <div class="search">
      <span class="g">G</span>
      <input name="q" placeholder="Suchen oder Adresse eingeben" autocomplete="off">
      <button aria-label="Suchen">→</button>
    </div>
  </form>

  <div class="breadcrumbs" id="breadcrumbs"></div>

  <div class="section-head">
    <h2 id="pageHeading" style="display:none"></h2>
    <button id="editHint" type="button">Gedrückt halten / ziehen</button>
  </div>

  <div class="sections" id="sections"></div>

  <div class="tip">Frei sortierbare Kacheln · bis zu 8 Abschnitte · Ordner · lokales Backup</div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel">
  <h3>Startseite anpassen</h3>
  <button id="addLinkMenu">＋ Verknüpfung hinzufügen</button>
  <button id="addFolderMenu">📁 Ordner hinzufügen</button>
  <button id="addSectionMenu">▤ Abschnitt hinzufügen</button>
  <button id="bgBtn">🖼 Hintergrundbild wählen</button>
  <button id="clearBgBtn">✕ Hintergrund entfernen</button>
  <button id="themeBtn" class="theme-row"><span id="themeLabel">🌙 Dark Mode</span><span class="theme-state" id="themeState">Aus</span></button>
  <button id="exportBtn">⇩ Sicherung exportieren</button>
  <button id="importBtn">⇧ Sicherung importieren</button>
  <button id="installBtn" style="display:none">⬇ App installieren</button>
</aside>

<dialog id="linkDlg">
<form method="dialog" class="dialog" id="linkForm">
  <h3 id="linkTitle">Verknüpfung</h3>
  <label>Name</label><input id="linkName" required placeholder="z. B. Wikipedia">
  <label>Adresse</label><input id="linkUrl" required inputmode="url" placeholder="https://…">
  <div class="section-select-wrap" id="linkSectionWrap"><label>Abschnitt</label><select id="linkSection"></select></div>
  <div class="row">
    <button class="btn" id="cancelLinkBtn" type="button">Abbrechen</button>
    <button class="btn danger" id="deleteLinkBtn" type="button">Löschen</button>
    <button class="btn primary" value="default">Speichern</button>
  </div>
</form>
</dialog>

<dialog id="folderDlg">
<form method="dialog" class="dialog" id="folderForm">
  <h3 id="folderTitle">Ordner</h3>
  <label>Name</label><input id="folderName" required placeholder="z. B. Nachrichten">
  <div class="section-select-wrap" id="folderSectionWrap"><label>Abschnitt</label><select id="folderSection"></select></div>
  <div class="row">
    <button class="btn" id="cancelFolderBtn" type="button">Abbrechen</button>
    <button class="btn danger" id="deleteFolderBtn" type="button">Löschen</button>
    <button class="btn primary" value="default">Speichern</button>
  </div>
</form>
</dialog>


<dialog id="sectionDlg">
<form method="dialog" class="dialog" id="sectionForm">
  <h3 id="sectionTitle">Abschnitt</h3>
  <label>Bezeichnung</label><input id="sectionName" required maxlength="40" placeholder="z. B. Arbeit">
  <div class="section-limit">Maximal 8 Abschnitte. Beim Löschen eines Abschnitts werden dessen Kacheln ebenfalls gelöscht.</div>
  <div class="row">
    <button class="btn" id="cancelSectionBtn" type="button">Abbrechen</button>
    <button class="btn danger" id="deleteSectionBtn" type="button">Löschen</button>
    <button class="btn primary" value="default">Speichern</button>
  </div>
</form>
</dialog>

<input id="bgFile" type="file" accept="image/*">
<input id="importFile" type="file" accept="application/json">

<script>
const KEY='neutral-android-home-v1', BGKEY='neutral-android-bg-v1', THEMEKEY='neutral-desktop-theme-v1';
const MAX_SECTIONS=8;
const $=id=>document.getElementById(id);
const sectionsEl=$('sections');
let editIndex=-1, editSectionId=null, editSectionMetaId=null;
let dragInfo=null, touchDrag=null, suppressClickUntil=0;

function uid(prefix='id'){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function clean(u){u=u.trim();return /^https?:\/\//i.test(u)?u:'https://'+u}
function host(u){try{return new URL(u).hostname}catch{return ''}}

function loadData(){
  let d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(!d){
    d={sections:[{id:'s_default',name:'Allgemein',items:[
      {type:'link',name:'Wikipedia',url:'https://de.wikipedia.org/'},
      {type:'link',name:'YouTube',url:'https://www.youtube.com/'},
      {type:'link',name:'Google',url:'https://www.google.de/'},
      {type:'link',name:'Amazon',url:'https://www.amazon.de/'}
    ]}],folders:{},currentFolder:null};
  }
  // Migration from older root-folder model. Existing links/folders remain intact.
  if(!Array.isArray(d.sections)){
    const rootItems=d.folders?.root?.items || [];
    d.sections=[{id:'s_default',name:'Allgemein',items:rootItems}];
    if(d.folders?.root) delete d.folders.root;
    d.currentFolder=d.current && d.current!=='root' ? d.current : null;
    delete d.current;
  }
  if(!d.sections.length) d.sections=[{id:'s_default',name:'Allgemein',items:[]}];
  d.sections=d.sections.slice(0,MAX_SECTIONS).map((s,i)=>({id:s.id||uid('s'),name:s.name||`Abschnitt ${i+1}`,items:Array.isArray(s.items)?s.items:[]}));
  d.folders=d.folders||{};
  d.currentFolder=d.currentFolder||null;
  return d;
}
let data=loadData();

function save(renderNow=true){localStorage.setItem(KEY,JSON.stringify(data)); if(renderNow) render()}
function sectionById(id){return data.sections.find(s=>s.id===id)}
function currentFolder(){return data.currentFolder ? data.folders[data.currentFolder] : null}
function currentItems(sectionId=null){
  if(data.currentFolder) return currentFolder()?.items || [];
  return sectionById(sectionId)?.items || [];
}
function defaultSectionId(){return data.sections[0]?.id||null}

function makeTile(x,i,sectionId,container){
  const t=document.createElement('div');
  t.className='tile'; t.dataset.index=i; t.dataset.sectionId=sectionId||''; t.draggable=true;
  if(x.type==='folder'){
    t.innerHTML=`<button class="more" type="button">⋮</button><div class="tile-link" role="button" tabindex="0"><div class="icon folder-icon">📁</div><div class="label">${esc(x.name)}</div></div>`;
    const open=()=>{if(Date.now()<suppressClickUntil)return;data.currentFolder=x.id;save()};
    t.querySelector('.tile-link').onclick=open;
    t.querySelector('.tile-link').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
  }else{
    const h=host(x.url),fav=h?`https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64`:'';
    t.innerHTML=`<button class="more" type="button">⋮</button><a class="tile-link" href="${esc(x.url)}"><div class="icon">${fav?`<img src="${fav}" onerror="this.remove()">`:esc((x.name||'?')[0])}</div><div class="label">${esc(x.name)}</div></a>`;
    t.querySelector('a').addEventListener('click',e=>{if(Date.now()<suppressClickUntil)e.preventDefault()});
  }
  t.querySelector('.more').onclick=e=>{e.preventDefault();e.stopPropagation();x.type==='folder'?openFolder(i,sectionId):openLink(i,sectionId)};

  // Desktop drag & drop. Tiles can also be moved between sections.
  t.ondragstart=e=>{
    dragInfo={fromSectionId:sectionId,index:i};
    t.classList.add('dragging');
    if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','tile')}catch{}}
  };
  t.ondragend=()=>{dragInfo=null;document.querySelectorAll('.tile').forEach(el=>el.classList.remove('dragging','drop-marker'));document.querySelectorAll('.section-block').forEach(el=>el.classList.remove('drag-target'))};
  t.ondragover=e=>{if(!dragInfo)return;e.preventDefault();t.classList.add('drop-marker')};
  t.ondragleave=()=>t.classList.remove('drop-marker');
  t.ondrop=e=>{e.preventDefault();t.classList.remove('drop-marker');if(!dragInfo)return;moveItem(dragInfo.fromSectionId,dragInfo.index,sectionId,i);dragInfo=null};
  attachLongPress(t,sectionId,i);
  container.appendChild(t);
}

function addTile(sectionId,container){
  const add=document.createElement('div'); add.className='tile add-tile';
  add.innerHTML='<div class="tile-link" role="button" tabindex="0"><div class="icon">＋</div><div class="label">Hinzufügen</div></div>';
  const open=()=>openLink(-1,sectionId);
  add.onclick=open; add.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
  // Dropping after the last tile in a section.
  add.ondragover=e=>{if(!dragInfo)return;e.preventDefault();add.classList.add('drop-marker')};
  add.ondragleave=()=>add.classList.remove('drop-marker');
  add.ondrop=e=>{e.preventDefault();add.classList.remove('drop-marker');if(!dragInfo)return;moveItem(dragInfo.fromSectionId,dragInfo.index,sectionId,currentItems(sectionId).length);dragInfo=null};
  container.appendChild(add);
}

function render(){
  sectionsEl.innerHTML='';
  const folder=currentFolder();
  $('breadcrumbs').innerHTML=folder?`<button id="backRoot" type="button">← Startseite</button> &nbsp; ${esc(folder.name)}`:'';
  if(folder) $('backRoot').onclick=()=>{data.currentFolder=null;save()};
  $('pageHeading').textContent=folder?'Ordner':'Verknüpfungen';
  $('addSectionMenu').style.display=folder?'none':'block';

  if(folder){
    const block=document.createElement('section'); block.className='section-block';
    const row=document.createElement('div'); row.className='section-title-row'; row.innerHTML=`<h2>${esc(folder.name)}</h2>`; block.appendChild(row);
    const grid=document.createElement('div'); grid.className='grid'; grid.dataset.sectionId='';
    folder.items.forEach((x,i)=>makeTile(x,i,null,grid)); addTile(null,grid); block.appendChild(grid); sectionsEl.appendChild(block);
    return;
  }

  data.sections.forEach(section=>{
    const block=document.createElement('section'); block.className='section-block'; block.dataset.sectionId=section.id;
    block.ondragover=e=>{if(!dragInfo)return;e.preventDefault();block.classList.add('drag-target')};
    block.ondragleave=e=>{if(!block.contains(e.relatedTarget))block.classList.remove('drag-target')};
    block.ondrop=e=>{if(e.target.closest('.tile'))return;e.preventDefault();block.classList.remove('drag-target');if(!dragInfo)return;moveItem(dragInfo.fromSectionId,dragInfo.index,section.id,section.items.length);dragInfo=null};
    const row=document.createElement('div'); row.className='section-title-row';
    row.innerHTML=`<h2>${esc(section.name)}</h2><div class="section-actions"><button class="section-action" type="button" title="Abschnitt bearbeiten" aria-label="Abschnitt bearbeiten">⋮</button></div>`;
    row.querySelector('button').onclick=()=>openSection(section.id);
    block.appendChild(row);
    const grid=document.createElement('div'); grid.className='grid'; grid.dataset.sectionId=section.id;
    section.items.forEach((x,i)=>makeTile(x,i,section.id,grid));
    addTile(section.id,grid); block.appendChild(grid); sectionsEl.appendChild(block);
  });
}

function moveItem(fromSectionId,fromIndex,toSectionId,toIndex){
  const from=currentItems(fromSectionId), to=currentItems(toSectionId);
  if(!from||!to||fromIndex<0||fromIndex>=from.length)return;
  const [item]=from.splice(fromIndex,1);
  if(from===to && fromIndex<toIndex) toIndex--;
  toIndex=Math.max(0,Math.min(toIndex,to.length));
  to.splice(toIndex,0,item); suppressClickUntil=Date.now()+450; save();
}

function attachLongPress(tile,sectionId,index){
  let timer=null,startX=0,startY=0,pointerId=null;
  const clear=()=>{clearTimeout(timer);timer=null;tile.classList.remove('longpress-ready')};

  // Native link menu weiterhin unterdrücken, ohne normales vertikales Scrollen zu blockieren.
  tile.addEventListener('contextmenu',e=>{
    if(e.target.closest('.more'))return;
    e.preventDefault();
    e.stopPropagation();
  });
  tile.addEventListener('selectstart',e=>{if(!e.target.closest('.more'))e.preventDefault()});

  tile.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'||e.button!==0||e.target.closest('.more'))return;
    pointerId=e.pointerId;startX=e.clientX;startY=e.clientY;
    // Wichtig: kein preventDefault() hier. Dadurch kann Android über den Kacheln scrollen.
    timer=setTimeout(()=>{
      timer=null;
      startTouchDrag(tile,sectionId,index,e.clientX,e.clientY,pointerId);
    },480);
  },{passive:true});

  tile.addEventListener('pointermove',e=>{
    if(timer && Math.hypot(e.clientX-startX,e.clientY-startY)>9){
      // Sobald der Finger wischt, Long-Press abbrechen und dem Browser das Scrollen überlassen.
      clear();
    }
  },{passive:true});

  tile.addEventListener('pointerup',clear);
  tile.addEventListener('pointercancel',clear);
}
function startTouchDrag(tile,sectionId,index,x,y,pointerId){
  suppressClickUntil=Date.now()+700; tile.classList.add('longpress-ready','touch-dragging');
  const ghost=tile.cloneNode(true); ghost.className='drag-ghost'; ghost.style.left=x+'px'; ghost.style.top=y+'px'; document.body.appendChild(ghost);
  touchDrag={fromSectionId:sectionId,index,tile,ghost,pointerId,lastTarget:null};
  try{tile.setPointerCapture(pointerId)}catch{}
  const move=e=>{
    if(!touchDrag||e.pointerId!==pointerId)return; e.preventDefault();
    ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
    document.querySelectorAll('.drop-marker,.drag-target').forEach(el=>el.classList.remove('drop-marker','drag-target'));
    const target=document.elementFromPoint(e.clientX,e.clientY);
    const targetTile=target?.closest('.tile:not(.add-tile)');
    const targetBlock=target?.closest('.section-block');
    if(targetTile) targetTile.classList.add('drop-marker'); else if(targetBlock) targetBlock.classList.add('drag-target');
    touchDrag.lastTarget={tile:targetTile,block:targetBlock};
  };
  const end=e=>{
    if(!touchDrag||e.pointerId!==pointerId)return;
    const info=touchDrag; touchDrag=null; tile.classList.remove('longpress-ready','touch-dragging'); ghost.remove();
    document.removeEventListener('pointermove',move,{capture:true});document.removeEventListener('pointerup',end,{capture:true});document.removeEventListener('pointercancel',end,{capture:true});
    document.querySelectorAll('.drop-marker,.drag-target').forEach(el=>el.classList.remove('drop-marker','drag-target'));
    const hit=info.lastTarget;
    if(hit?.tile){const sid=hit.tile.dataset.sectionId||null;const idx=Number(hit.tile.dataset.index);moveItem(info.fromSectionId,info.index,sid,idx)}
    else if(hit?.block){const sid=hit.block.dataset.sectionId||null;moveItem(info.fromSectionId,info.index,sid,currentItems(sid).length)}
  };
  document.addEventListener('pointermove',move,{capture:true,passive:false});document.addEventListener('pointerup',end,{capture:true});document.addEventListener('pointercancel',end,{capture:true});
}

function fillSectionSelect(selectId,selected){
  const sel=$(selectId); sel.innerHTML=data.sections.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?'selected':''}>${esc(s.name)}</option>`).join('');
}
function openLink(i=-1,sectionId=null){
  editIndex=i; editSectionId=sectionId||defaultSectionId();
  const arr=currentItems(sectionId), x=i>=0?arr[i]:null;
  $('linkTitle').textContent=i<0?'Verknüpfung hinzufügen':'Verknüpfung bearbeiten'; $('linkName').value=x?.name||''; $('linkUrl').value=x?.url||'';
  $('deleteLinkBtn').style.display=i<0?'none':'inline-block';
  const show=!data.currentFolder; $('linkSectionWrap').classList.toggle('show',show); if(show)fillSectionSelect('linkSection',editSectionId);
  $('linkDlg').showModal();
}
$('linkForm').addEventListener('submit',e=>{
  e.preventDefault(); const name=$('linkName').value.trim(),raw=$('linkUrl').value.trim(); if(!name||!raw)return;
  const x={type:'link',name,url:clean(raw)};
  if(data.currentFolder){editIndex<0?currentItems().push(x):currentItems()[editIndex]=x}
  else{
    const target=$('linkSection').value||editSectionId;
    if(editIndex<0)sectionById(target).items.push(x);
    else if(target===editSectionId)currentItems(editSectionId)[editIndex]=x;
    else{currentItems(editSectionId).splice(editIndex,1);sectionById(target).items.push(x)}
  }
  save();$('linkDlg').close();
});
$('cancelLinkBtn').onclick=()=>$('linkDlg').close();
$('deleteLinkBtn').onclick=()=>{if(editIndex>=0&&confirm('Verknüpfung löschen?')){currentItems(editSectionId).splice(editIndex,1);save();$('linkDlg').close()}};

function openFolder(i=-1,sectionId=null){
  editIndex=i; editSectionId=sectionId||defaultSectionId(); const arr=currentItems(sectionId),x=i>=0?arr[i]:null;
  $('folderTitle').textContent=i<0?'Ordner hinzufügen':'Ordner bearbeiten'; $('folderName').value=x?.name||''; $('deleteFolderBtn').style.display=i<0?'none':'inline-block';
  const show=!data.currentFolder; $('folderSectionWrap').classList.toggle('show',show); if(show)fillSectionSelect('folderSection',editSectionId);
  $('folderDlg').showModal();
}
$('folderForm').addEventListener('submit',e=>{
  e.preventDefault(); const name=$('folderName').value.trim();if(!name)return;
  if(editIndex<0){const id=uid('f');data.folders[id]={name,items:[]};const item={type:'folder',name,id}; if(data.currentFolder)currentItems().push(item);else sectionById($('folderSection').value||editSectionId).items.push(item)}
  else{const item=currentItems(editSectionId)[editIndex];item.name=name;data.folders[item.id].name=name;if(!data.currentFolder){const target=$('folderSection').value||editSectionId;if(target!==editSectionId){currentItems(editSectionId).splice(editIndex,1);sectionById(target).items.push(item)}}}
  save();$('folderDlg').close();
});
$('cancelFolderBtn').onclick=()=>$('folderDlg').close();
$('deleteFolderBtn').onclick=()=>{if(editIndex<0)return;const item=currentItems(editSectionId)[editIndex];if(confirm('Ordner und alle Inhalte löschen?')){delete data.folders[item.id];currentItems(editSectionId).splice(editIndex,1);save();$('folderDlg').close()}};

function openSection(id=null){
  editSectionMetaId=id; const s=id?sectionById(id):null;
  $('sectionTitle').textContent=id?'Abschnitt bearbeiten':'Abschnitt hinzufügen';$('sectionName').value=s?.name||'';$('deleteSectionBtn').style.display=id?'inline-block':'none';$('sectionDlg').showModal();
}
$('sectionForm').addEventListener('submit',e=>{
  e.preventDefault();const name=$('sectionName').value.trim();if(!name)return;
  if(editSectionMetaId)sectionById(editSectionMetaId).name=name;
  else{if(data.sections.length>=MAX_SECTIONS){alert('Es sind maximal 8 Abschnitte möglich.');return}data.sections.push({id:uid('s'),name,items:[]})}
  save();$('sectionDlg').close();
});
$('cancelSectionBtn').onclick=()=>$('sectionDlg').close();
$('deleteSectionBtn').onclick=()=>{
  if(!editSectionMetaId)return;if(data.sections.length<=1){alert('Mindestens ein Abschnitt muss erhalten bleiben.');return}
  const s=sectionById(editSectionMetaId);if(confirm(`Abschnitt „${s.name}“ und alle darin enthaltenen Kacheln löschen?`)){data.sections=data.sections.filter(x=>x.id!==editSectionMetaId);save();$('sectionDlg').close()}
};

function openPanel(v=true){$('panel').classList.toggle('open',v);$('overlay').classList.toggle('open',v)}
$('settingsBtn').onclick=()=>openPanel(true);$('overlay').onclick=()=>openPanel(false);
$('addLinkMenu').onclick=()=>{openPanel(false);openLink(-1,defaultSectionId())};
$('addFolderMenu').onclick=()=>{openPanel(false);openFolder(-1,defaultSectionId())};
$('addSectionMenu').onclick=()=>{openPanel(false);if(data.sections.length>=MAX_SECTIONS)alert('Es sind maximal 8 Abschnitte möglich.');else openSection(null)};

$('bgBtn').onclick=()=>{$('bgFile').click();openPanel(false)};
$('bgFile').onchange=()=>{const f=$('bgFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{localStorage.setItem(BGKEY,r.result);applyBg()};r.readAsDataURL(f);$('bgFile').value=''};
$('clearBgBtn').onclick=()=>{localStorage.removeItem(BGKEY);applyBg();openPanel(false)};
function applyTheme(){const saved=localStorage.getItem(THEMEKEY);const dark=saved?saved==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=dark?'dark':'light';$('themeLabel').textContent=dark?'☀️ Light Mode':'🌙 Dark Mode';$('themeState').textContent=dark?'An':'Aus'}
$('themeBtn').onclick=()=>{localStorage.setItem(THEMEKEY,document.documentElement.dataset.theme==='dark'?'light':'dark');applyTheme()};
function applyBg(){const bg=localStorage.getItem(BGKEY);document.body.style.backgroundImage=bg?`url("${bg}")`:'';document.body.classList.toggle('has-bg',!!bg)}

$('exportBtn').onclick=()=>{const pack={version:2,data,bg:localStorage.getItem(BGKEY)||null,theme:localStorage.getItem(THEMEKEY)||null};const b=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meine-startseite-backup.json';a.click();URL.revokeObjectURL(a.href);openPanel(false)};
$('importBtn').onclick=()=>{$('importFile').click();openPanel(false)};
$('importFile').onchange=async()=>{try{const p=JSON.parse(await $('importFile').files[0].text());if(p.data){localStorage.setItem(KEY,JSON.stringify(p.data));data=loadData()}if(p.bg)localStorage.setItem(BGKEY,p.bg);else if(p.bg===null)localStorage.removeItem(BGKEY);if(p.theme)localStorage.setItem(THEMEKEY,p.theme);applyTheme();applyBg();save()}catch{alert('Ungültige Sicherungsdatei.')} $('importFile').value=''};

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredInstallPrompt=e;
  const b=$('installBtn');if(b)b.style.display='block';
});
$('installBtn')?.addEventListener('click',async()=>{
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  try{await deferredInstallPrompt.userChoice}catch{}
  deferredInstallPrompt=null;$('installBtn').style.display='none';openPanel(false);
});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;const b=$('installBtn');if(b)b.style.display='none'});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}

applyTheme();applyBg();save();
</script>
